name: Mirror IPAs - Remaining Only

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Mirror remaining IPAs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: "ikira18/install"
          TAG: "ipa-mirror"
        run: |
          curl -s \
            -H "Authorization: token $GH_PAT" \
            "https://raw.githubusercontent.com/ikira18/feather/main/source" \
            -o source.json

          GH_TOKEN=$GH_PAT gh release view "$TAG" \
            -R "$TARGET_REPO" \
            --json assets \
            --jq '.assets[].name' > existing.txt

          echo "📦 موجود بالريليس: $(wc -l < existing.txt) ملف"

          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('source.json','utf8'));
            const existing = new Set(
              fs.readFileSync('existing.txt','utf8')
                .trim().split('\n').map(f => f.trim())
            );
            data.apps.forEach(a => {
              if (a.downloadURL && a.downloadURL.includes('dl.ikiraplus.workers.dev')) {
                const slug = a.downloadURL.split('/dl/')[1];
                const filename = slug + '.ipa';
                if (!existing.has(filename)) {
                  console.log(a.name + '|' + a.downloadURL + '|' + slug);
                }
              }
            });
          " > remaining.txt

          TOTAL=$(wc -l < remaining.txt)
          echo "⏳ متبقي: $TOTAL تطبيق"

          if [ "$TOTAL" -eq 0 ]; then
            echo "✅ كل التطبيقات موجودة!"
            exit 0
          fi

          PASS=0; FAIL=0; SKIP=0; COUNT=0

          while IFS='|' read -r NAME URL SLUG; do
            COUNT=$((COUNT+1))
            FILENAME="${SLUG}.ipa"
            echo ""
            echo "[$COUNT/$TOTAL] ⬇️  $NAME"

            SIZE_BYTES=$(curl -sI \
              -H "User-Agent: Mozilla/5.0" \
              -L "$URL" | grep -i content-length | tail -1 | tr -d '\r' | awk '{print $2}')

            if [ -n "$SIZE_BYTES" ] && [ "$SIZE_BYTES" -gt 1073741824 ] 2>/dev/null; then
              SIZE_GB=$(echo "scale=2; $SIZE_BYTES/1073741824" | bc)
              echo "  ⏭️  تجاهل — الحجم ${SIZE_GB}GB"
              SKIP=$((SKIP+1))
              continue
            fi

            HTTP=$(curl -s -o "$FILENAME" -w "%{http_code}" \
              -L --max-time 600 --retry 2 \
              -H "User-Agent: Mozilla/5.0" \
              "$URL")

            if [ "$HTTP" = "200" ] && [ -s "$FILENAME" ]; then
              ACTUAL_SIZE=$(stat -c%s "$FILENAME")
              if [ "$ACTUAL_SIZE" -gt 1073741824 ]; then
                echo "  ⏭️  تجاهل — الحجم كبير بعد التحميل"
                rm -f "$FILENAME"
                SKIP=$((SKIP+1))
                continue
              fi
              echo "  ✅ $(du -sh $FILENAME | cut -f1) — رفع..."
              GH_TOKEN=$GH_PAT gh release upload "$TAG" "$FILENAME" --clobber -R "$TARGET_REPO" || echo "  ⚠️ فشل الرفع، متابعة..."
              PASS=$((PASS+1))
            else
              echo "  ❌ فشل HTTP $HTTP"
              FAIL=$((FAIL+1))
            fi
            rm -f "$FILENAME"
          done < remaining.txt

          echo ""
          echo "========================"
          echo "✅ نجح:    $PASS"
          echo "❌ فشل:    $FAIL"
          echo "⏭️  تجاهل: $SKIP"
          echo "========================"

      - name: Trigger next run if still remaining
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          REMAINING=$(wc -l < remaining.txt 2>/dev/null || echo 0)
          if [ "$REMAINING" -gt 0 ]; then
            echo "🔄 لا يزال يوجد تطبيقات — تشغيل الدورة القادمة..."
            curl -s -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/ikira18/feather/actions/workflows/mirror-apps.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "✅ انتهى كل شي!"
          fi
