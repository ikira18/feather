name: Mirror IPAs - Remaining Only

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Mirror remaining IPAs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: "ikira18/install"
          TAG: "ipa-mirror"
        run: |
          # جيب الـ source
          curl -s \
            -H "Authorization: token $GH_PAT" \
            "https://raw.githubusercontent.com/ikira18/feather/main/source" \
            -o source.json

          # جيب قائمة الملفات الموجودة بالريليس
          GH_TOKEN=$GH_PAT gh release view "$TAG" \
            -R "$TARGET_REPO" \
            --json assets \
            --jq '.assets[].name' > existing.txt

          echo "📦 موجود بالريليس: $(wc -l < existing.txt) ملف"

          # استخرج التطبيقات الناقصة فقط
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('source.json','utf8'));
            const existing = new Set(
              fs.readFileSync('existing.txt','utf8')
                .trim().split('\n')
                .map(f => f.trim())
            );
            data.apps.forEach(a => {
              if (a.downloadURL && a.downloadURL.includes('dl.ikiraplus.workers.dev')) {
                const slug = a.downloadURL.split('/dl/')[1];
                const filename = slug + '.ipa';
                if (!existing.has(filename)) {
                  console.log(a.name + '|' + a.downloadURL + '|' + slug);
                }
              }
            });
          " > remaining.txt

          TOTAL=$(wc -l < remaining.txt)
          echo "⏳ متبقي للتحميل: $TOTAL تطبيق"

          if [ "$TOTAL" -eq 0 ]; then
            echo "✅ كل التطبيقات موجودة!"
            exit 0
          fi

          PASS=0; FAIL=0; COUNT=0

          while IFS='|' read -r NAME URL SLUG; do
            COUNT=$((COUNT+1))
            FILENAME="${SLUG}.ipa"
            echo ""
            echo "[$COUNT/$TOTAL] ⬇️  $NAME"

            HTTP=$(curl -s -o "$FILENAME" -w "%{http_code}" \
              -L --max-time 600 --retry 2 \
              -H "User-Agent: Mozilla/5.0" \
              "$URL")

            if [ "$HTTP" = "200" ] && [ -s "$FILENAME" ]; then
              echo "  ✅ $(du -sh $FILENAME | cut -f1) — رفع..."
              GH_TOKEN=$GH_PAT gh release upload "$TAG" "$FILENAME" --clobber -R "$TARGET_REPO"
              PASS=$((PASS+1))
            else
              echo "  ❌ فشل HTTP $HTTP"
              FAIL=$((FAIL+1))
            fi
            rm -f "$FILENAME"
          done < remaining.txt

          echo ""
          echo "========================"
          echo "✅ نجح: $PASS"
          echo "❌ فشل: $FAIL"
          echo "========================"
