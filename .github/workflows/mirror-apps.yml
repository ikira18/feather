name: Mirror IPAs to gta Repo Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror IPAs to gta repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # مو GITHUB_TOKEN — لازم PAT
          TARGET_REPO: "ikiraplus/gta"       # ← غير هذا لاسم ريبوك
          TAG: "ipa-mirror"
        run: |
          node -e "
            const data = require('./jom.json');
            const apps = data.apps.filter(a =>
              a.ipaUrl && a.ipaUrl.includes('dl.ikiraplus.workers.dev')
            );
            apps.forEach(a => {
              const slug = a.ipaUrl.split('/dl/')[1];
              console.log(a.id + '|' + a.name + '|' + a.ipaUrl + '|' + slug);
            });
          " > apps_list.txt

          echo "📋 Found $(wc -l < apps_list.txt) apps"

          # إنشاء ريليس بالريبو الثاني إذا ما موجود
          if ! gh release view "$TAG" -R "$TARGET_REPO" > /dev/null 2>&1; then
            gh release create "$TAG" \
              -R "$TARGET_REPO" \
              --title "IPA Mirror — iKiraPlus Store" \
              --notes "تحديث تلقائي" \
              --prerelease
          fi

          PASS=0; FAIL=0

          while IFS='|' read -r ID NAME URL SLUG; do
            FILENAME="${SLUG}.ipa"
            echo "⬇️  $NAME"

            HTTP=$(curl -s -o "$FILENAME" -w "%{http_code}" \
              -L --max-time 600 --retry 2 \
              -H "User-Agent: Mozilla/5.0" \
              "$URL")

            if [ "$HTTP" = "200" ] && [ -s "$FILENAME" ]; then
              echo "✅ $(du -sh $FILENAME | cut -f1) — uploading..."
              gh release upload "$TAG" "$FILENAME" --clobber -R "$TARGET_REPO"
              PASS=$((PASS+1))
            else
              echo "❌ Failed HTTP $HTTP"
              FAIL=$((FAIL+1))
            fi

            rm -f "$FILENAME"
          done < apps_list.txt

          echo "✅ $PASS done | ❌ $FAIL failed"
