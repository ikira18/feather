name: Mirror IPAs to install repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror IPAs from source to install/releases
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: "ikira18/install"
          TAG: "ipa-mirror"
        run: |
          # جيب الـ source بالتوكن
          curl -s \
            -H "Authorization: token $GH_PAT" \
            "https://raw.githubusercontent.com/ikira18/feather/main/source" \
            -o source.json

          # تحقق إن الملف صح
          if ! node -e "JSON.parse(require('fs').readFileSync('source.json','utf8'))" 2>/dev/null; then
            echo "❌ فشل تحميل source.json"
            cat source.json
            exit 1
          fi

          # استخرج التطبيقات
          node -e "
            const data = JSON.parse(require('fs').readFileSync('source.json','utf8'));
            data.apps.forEach(a => {
              if (a.downloadURL && a.downloadURL.includes('dl.ikiraplus.workers.dev')) {
                const slug = a.downloadURL.split('/dl/')[1];
                console.log(a.name + '|' + a.downloadURL + '|' + slug);
              }
            });
          " > apps_list.txt

          TOTAL=$(wc -l < apps_list.txt)
          echo "📋 عدد التطبيقات: $TOTAL"

          # إنشاء الريليس إذا ما موجود
          if ! GH_TOKEN=$GH_PAT gh release view "$TAG" -R "$TARGET_REPO" > /dev/null 2>&1; then
            GH_TOKEN=$GH_PAT gh release create "$TAG" \
              -R "$TARGET_REPO" \
              --title "IPA Mirror — iKiraPlus Store" \
              --notes "ميرور تلقائي لتطبيقات متجر iKiraPlus" \
              --prerelease
            echo "✅ تم إنشاء الريليس"
          else
            echo "ℹ️ الريليس موجود، سيتم التحديث"
          fi

          PASS=0
          FAIL=0
          COUNT=0

          while IFS='|' read -r NAME URL SLUG; do
            COUNT=$((COUNT+1))
            FILENAME="${SLUG}.ipa"
            echo ""
            echo "[$COUNT/$TOTAL] ⬇️  $NAME"

            HTTP=$(curl -s -o "$FILENAME" -w "%{http_code}" \
              -L --max-time 600 --retry 2 \
              -H "User-Agent: Mozilla/5.0" \
              "$URL")

            if [ "$HTTP" = "200" ] && [ -s "$FILENAME" ]; then
              SIZE=$(du -sh "$FILENAME" | cut -f1)
              echo "   ✅ $SIZE — جاري الرفع..."
              GH_TOKEN=$GH_PAT gh release upload "$TAG" "$FILENAME" --clobber -R "$TARGET_REPO"
              PASS=$((PASS+1))
            else
              echo "   ❌ فشل (HTTP $HTTP)"
              FAIL=$((FAIL+1))
            fi

            rm -f "$FILENAME"
          done < apps_list.txt

          echo ""
          echo "================================"
          echo "✅ نجح: $PASS تطبيق"
          echo "❌ فشل: $FAIL تطبيق"
          echo "================================"
